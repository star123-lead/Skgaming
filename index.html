<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKGAMING - Space Shooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /*
    Design: retro arcade cabinet / CRT terminal.
    Palette — Void #05060d, Cabinet #17101f, Marquee Amber #ffb020,
    Circuit Cyan #2de2e6, Alert Magenta #ff3b7f, Paper White #f4f2ff.
    Display type: 'Press Start 2P' (pixel), used only for the marquee
    logo, HUD readout and buttons. Body copy stays in a plain sans
    stack for legibility at small sizes.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #05060d;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% -10%, #1c1330 0%, #05060d 60%);
  }
  /* the metal frame around the "screen" */
  #screenFrame {
    position: relative;
    padding: 10px;
    border-radius: 22px;
    background: linear-gradient(155deg, #2a2038 0%, #150e20 55%, #0c0814 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 18px 50px rgba(0,0,0,0.6);
    max-width: 100vw;
    max-height: 100vh;
    display: flex;
  }
  canvas {
    display: block;
    background: radial-gradient(ellipse at 50% 0%, #131b3a 0%, #05060d 72%);
    touch-action: none;
    max-width: 100%;
    max-height: 100%;
    border-radius: 14px;
  }
  /* CRT scanline + vignette texture, purely decorative */
  #crtOverlay {
    position: absolute;
    inset: 10px;
    border-radius: 14px;
    pointer-events: none;
    z-index: 6;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.16) 0px,
        rgba(0,0,0,0.16) 1px,
        transparent 1px,
        transparent 3px
      );
    box-shadow: inset 0 0 90px rgba(0,0,0,0.65);
    mix-blend-mode: multiply;
  }
  .overlay {
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #f4f2ff;
    text-align: center;
    background: rgba(4, 3, 10, 0.88);
    z-index: 10;
    padding: 24px 20px;
    border-radius: 14px;
    overflow-y: auto;
  }
  .marquee {
    font-family: 'Press Start 2P', 'Segoe UI', monospace;
    font-size: clamp(1.5rem, 8vw, 2.3rem);
    line-height: 1.4;
    color: #ffb020;
    text-shadow:
      0 0 6px rgba(255,176,32,0.8),
      0 0 22px rgba(255,176,32,0.45);
    margin-bottom: 6px;
    animation: flicker-in 1.1s ease-out;
  }
  @keyframes flicker-in {
    0% { opacity: 0; text-shadow: none; }
    8% { opacity: 1; }
    10% { opacity: 0.2; }
    14% { opacity: 1; }
    18% { opacity: 0.4; }
    22% { opacity: 1; text-shadow: 0 0 6px rgba(255,176,32,0.8), 0 0 22px rgba(255,176,32,0.45); }
    100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .marquee { animation: none; }
  }
  .subtitle {
    color: #8a7fae;
    font-size: 0.8rem;
    letter-spacing: 3px;
    margin-bottom: 24px;
  }
  .btn {
    position: relative;
    background: linear-gradient(180deg, #ffcb52, #ffb020 55%, #e08e00);
    color: #241300;
    border: none;
    border-bottom: 4px solid #a86400;
    padding: 15px 40px;
    font-family: 'Press Start 2P', 'Segoe UI', monospace;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 1px;
    border-radius: 10px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.35), 0 10px 26px rgba(255, 176, 32, 0.35);
  }
  .btn:active {
    transform: translateY(3px);
    border-bottom-width: 1px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  .instructions {
    margin-top: 22px;
    color: #8a7fae;
    font-size: 0.82rem;
    max-width: 300px;
    line-height: 1.7;
  }
  .instructions b { color: #cfc7ec; }
  .score-line {
    font-family: 'Press Start 2P', 'Segoe UI', monospace;
    font-size: 1.15rem;
    margin: 14px 0 6px;
    color: #ffb020;
  }
  .score-sub {
    color: #8a7fae;
    font-size: 0.85rem;
    margin-bottom: 26px;
  }
  #hud {
    position: absolute;
    top: calc(env(safe-area-inset-top, 14px) + 10px);
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 18px;
    z-index: 5;
    pointer-events: none;
  }
  #hud .readout {
    background: rgba(5, 6, 13, 0.55);
    border: 1px solid rgba(45, 226, 230, 0.3);
    border-radius: 8px;
    padding: 6px 10px;
  }
  #hud .tag {
    font-size: 0.6rem;
    letter-spacing: 1px;
    color: #2de2e6;
    opacity: 0.9;
    display: block;
    font-family: 'Press Start 2P', 'Segoe UI', monospace;
  }
  #hud .score {
    font-family: 'Press Start 2P', 'Segoe UI', monospace;
    color: #ffb020;
    font-size: 0.95rem;
    margin-top: 5px;
  }
  #livesBox {
    display: flex;
    gap: 6px;
    background: rgba(5, 6, 13, 0.55);
    border: 1px solid rgba(255, 59, 127, 0.3);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .lifeIcon {
    width: 14px;
    height: 14px;
    background: #ff3b7f;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    filter: drop-shadow(0 0 3px rgba(255,59,127,0.8));
  }
  .hidden { display: none !important; }

  .setupForm {
    width: 100%;
    max-width: 300px;
    margin: 6px 0 22px;
    text-align: left;
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    color: #a99cd4;
    font-size: 0.78rem;
    margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #382a52;
    background: #100a1c;
    color: #f4f2ff;
    font-size: 1rem;
    outline: none;
  }
  .field input::placeholder { color: #5d5480; }
  .field input:focus {
    border-color: #2de2e6;
    box-shadow: 0 0 0 3px rgba(45, 226, 230, 0.15);
  }
  .field input.errorField {
    border-color: #ff3b7f;
    animation: shake 0.3s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .diffRow {
    display: flex;
    gap: 8px;
  }
  .diffBtn {
    flex: 1;
    padding: 11px 4px;
    border-radius: 8px;
    border: 1px solid #382a52;
    background: #100a1c;
    color: #a99cd4;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }
  .diffBtn.active {
    border-color: transparent;
    color: #0a0e1a;
  }
  .diffBtn.active[data-level="normal"] { background: linear-gradient(90deg, #2de2e6, #6ff0f2); }
  .diffBtn.active[data-level="medium"] { background: linear-gradient(90deg, #ffb020, #ffcb52); }
  .diffBtn.active[data-level="hard"] { background: linear-gradient(90deg, #ff3b7f, #ff6fa0); }
  .welcomeLine {
    color: #2de2e6;
    font-size: 0.85rem;
    margin-bottom: 6px;
  }
</style>
</head>
<body>
<div id="gameContainer">
<div id="screenFrame">
  <canvas id="game" width="480" height="800"></canvas>

  <div id="hud" class="hidden">
    <div class="readout">
      <span class="tag" id="hudTag">SKGAMING</span>
      <div class="score" id="liveScore">0</div>
    </div>
    <div id="livesBox"></div>
  </div>

  <div id="startScreen" class="overlay">
    <div class="marquee">SKGAMING</div>
    <div class="subtitle">Space Shooter</div>

    <div class="setupForm">
      <div class="field">
        <label for="nameInput">Pilot name</label>
        <input type="text" id="nameInput" placeholder="Enter your name" maxlength="16" autocomplete="off">
      </div>
      <div class="field">
        <label for="ageInput">Age</label>
        <input type="number" id="ageInput" placeholder="Enter your age" min="1" max="120" inputmode="numeric">
      </div>
      <div class="field">
        <label>Difficulty</label>
        <div class="diffRow" id="diffRow">
          <button type="button" class="diffBtn" data-level="normal">Normal</button>
          <button type="button" class="diffBtn" data-level="medium">Medium</button>
          <button type="button" class="diffBtn" data-level="hard">Hard</button>
        </div>
      </div>
    </div>

    <button class="btn" id="startBtn">▶ Start</button>
    <div class="instructions">
      <b>Drag</b> anywhere to move your ship.<br>
      Your ship <b>auto-fires</b> — just dodge and destroy the enemies before they reach you!
    </div>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <div class="marquee" style="font-size: clamp(1.2rem, 6vw, 1.7rem);">GAME OVER</div>
    <div class="welcomeLine" id="gameOverName"></div>
    <div class="score-line" id="finalScore">Score: 0</div>
    <div class="score-sub" id="highScoreLine">Best: 0</div>
    <button class="btn" id="restartBtn">↻ Retry</button>
  </div>

  <div id="crtOverlay"></div>
</div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    const framePad = 20; // #screenFrame padding (10px each side)
    const maxW = Math.min(window.innerWidth, 520) - framePad;
    let w = maxW;
    let h = window.innerHeight - framePad;
    // maintain a portrait-ish aspect but fill screen height
    canvas.style.height = h + 'px';
    canvas.style.width = w + 'px';
    canvas.width = w * (window.devicePixelRatio || 1);
    canvas.height = h * (window.devicePixelRatio || 1);
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    W = w; H = h;
  }

  let W = 480, H = 800;

  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const hud = document.getElementById('hud');
  const liveScoreEl = document.getElementById('liveScore');
  const finalScoreEl = document.getElementById('finalScore');
  const highScoreLine = document.getElementById('highScoreLine');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const livesBox = document.getElementById('livesBox');
  const nameInput = document.getElementById('nameInput');
  const ageInput = document.getElementById('ageInput');
  const diffRow = document.getElementById('diffRow');
  const diffBtns = Array.from(diffRow.querySelectorAll('.diffBtn'));
  const hudTag = document.getElementById('hudTag');
  const gameOverName = document.getElementById('gameOverName');

  const DIFFICULTY_SETTINGS = {
    normal: { spawnInterval: 70, speedMult: 1.0, diffGrowth: 300, lives: 3 },
    medium: { spawnInterval: 58, speedMult: 1.3, diffGrowth: 260, lives: 3 },
    hard:   { spawnInterval: 48, speedMult: 1.65, diffGrowth: 220, lives: 2 }
  };

  let playerName = '';
  let playerAge = '';
  let difficultyLevel = 'normal';
  let diffSettings = DIFFICULTY_SETTINGS.normal;

  function loadSavedSetup() {
    try {
      const saved = JSON.parse(localStorage.getItem('skgaming_setup') || '{}');
      if (saved.name) nameInput.value = saved.name;
      if (saved.age) ageInput.value = saved.age;
      if (saved.difficulty && DIFFICULTY_SETTINGS[saved.difficulty]) {
        difficultyLevel = saved.difficulty;
      }
    } catch (e) {}
    setActiveDiffBtn();
  }

  function setActiveDiffBtn() {
    diffBtns.forEach(b => b.classList.toggle('active', b.dataset.level === difficultyLevel));
  }

  nameInput.addEventListener('input', () => nameInput.classList.remove('errorField'));
  ageInput.addEventListener('input', () => ageInput.classList.remove('errorField'));

  diffBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      difficultyLevel = btn.dataset.level;
      setActiveDiffBtn();
    });
  });

  function getHighScoreKey() {
    return 'skgaming_highscore_' + difficultyLevel;
  }

  function validateAndCollectSetup() {
    let ok = true;
    const name = nameInput.value.trim();
    const age = ageInput.value.trim();
    nameInput.classList.remove('errorField');
    ageInput.classList.remove('errorField');
    if (!name) {
      nameInput.classList.add('errorField');
      ok = false;
    }
    if (!age || isNaN(age) || Number(age) <= 0 || Number(age) > 120) {
      ageInput.classList.add('errorField');
      ok = false;
    }
    if (!ok) return null;
    return { name, age };
  }

  let highScore = 0;
  let state = 'idle';

  const player = { x: 0, y: 0, w: 40, h: 46, lives: 3, fireTimer: 0, fireRate: 14, invuln: 0 };
  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let particles = [];
  let stars = [];

  let score = 0;
  let frame = 0;
  let spawnTimer = 0;
  let spawnInterval = 70;
  let difficulty = 1;

  let pointerActive = false;
  let pointerX = 0, pointerY = 0;

  function initStars() {
    stars = [];
    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 0.5 + Math.random() * 2,
        size: Math.random() * 2 + 0.5
      });
    }
  }

  function resetGame() {
    diffSettings = DIFFICULTY_SETTINGS[difficultyLevel] || DIFFICULTY_SETTINGS.normal;
    player.x = W / 2;
    player.y = H - 110;
    player.lives = diffSettings.lives;
    player.fireTimer = 0;
    player.invuln = 0;
    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    score = 0;
    frame = 0;
    spawnTimer = 0;
    spawnInterval = diffSettings.spawnInterval;
    difficulty = 1;
    initStars();
    updateLivesUI();
    hudTag.textContent = playerName ? playerName.toUpperCase() : 'SKGAMING';
  }

  function updateLivesUI() {
    livesBox.innerHTML = '';
    for (let i = 0; i < player.lives; i++) {
      const d = document.createElement('div');
      d.className = 'lifeIcon';
      livesBox.appendChild(d);
    }
  }

  function startGame() {
    resetGame();
    state = 'playing';
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    requestAnimationFrame(loop);
  }

  function endGame() {
    state = 'over';
    const key = getHighScoreKey();
    highScore = Number(localStorage.getItem(key) || 0);
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem(key, String(highScore)); } catch (e) {}
    }
    gameOverName.textContent = playerName ? (playerName + ' — ' + difficultyLevel.toUpperCase()) : difficultyLevel.toUpperCase();
    finalScoreEl.textContent = 'Score: ' + score;
    highScoreLine.textContent = 'Best: ' + highScore;
    hud.classList.add('hidden');
    gameOverScreen.classList.remove('hidden');
  }

  function spawnEnemy() {
    const kind = Math.random();
    let type;
    if (kind < 0.55) {
      type = { w: 34, h: 30, hp: 1, speed: 1.3 + difficulty * 0.15, color: '#ff3b7f', points: 10, shoots: false };
    } else if (kind < 0.85) {
      type = { w: 40, h: 36, hp: 2, speed: 1 + difficulty * 0.12, color: '#ffb020', points: 20, shoots: true };
    } else {
      type = { w: 50, h: 44, hp: 4, speed: 0.7 + difficulty * 0.1, color: '#8b5cf6', points: 40, shoots: true };
    }
    const x = 30 + Math.random() * (W - 60);
    enemies.push({
      x, y: -40, w: type.w, h: type.h, hp: type.hp, maxHp: type.hp,
      speed: type.speed, color: type.color, points: type.points,
      shoots: type.shoots, shootTimer: Math.random() * 60,
      wobble: Math.random() * Math.PI * 2
    });
  }

  function shootPlayerBullet() {
    bullets.push({ x: player.x, y: player.y - player.h / 2, w: 4, h: 14, speed: 9 });
  }

  function shootEnemyBullet(e) {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    const speed = 3.2 + difficulty * 0.1;
    enemyBullets.push({
      x: e.x, y: e.y + e.h / 2, w: 5, h: 5,
      vx: (dx / dist) * speed, vy: (dy / dist) * speed
    });
  }

  function spawnBurst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
        life: 26, color, size: 2 + Math.random() * 3
      });
    }
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    frame++;
    difficulty = (1 + score / diffSettings.diffGrowth) * diffSettings.speedMult;

    // stars
    stars.forEach(s => {
      s.y += s.speed;
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    });

    // player movement toward pointer
    if (pointerActive) {
      const dx = pointerX - player.x;
      const dy = pointerY - player.y;
      player.x += dx * 0.25;
      player.y += dy * 0.25;
    }
    player.x = Math.max(24, Math.min(W - 24, player.x));
    player.y = Math.max(60, Math.min(H - 40, player.y));

    if (player.invuln > 0) player.invuln--;

    // auto fire
    player.fireTimer++;
    const currentFireRate = Math.max(8, player.fireRate - difficulty);
    if (player.fireTimer > currentFireRate) {
      player.fireTimer = 0;
      shootPlayerBullet();
    }

    // spawn enemies
    spawnTimer++;
    const dynInterval = Math.max(24, spawnInterval - difficulty * 6);
    if (spawnTimer > dynInterval) {
      spawnTimer = 0;
      spawnEnemy();
    }

    // update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y -= bullets[i].speed;
      if (bullets[i].y < -20) bullets.splice(i, 1);
    }

    // update enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.x += b.vx; b.y += b.vy;
      if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) {
        enemyBullets.splice(i, 1);
        continue;
      }
      if (player.invuln <= 0) {
        const pBox = { x: player.x - 12, y: player.y - 14, w: 24, h: 28 };
        if (rectsOverlap(pBox, { x: b.x - 3, y: b.y - 3, w: 6, h: 6 })) {
          enemyBullets.splice(i, 1);
          hitPlayer();
        }
      }
    }

    // update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.wobble += 0.05;
      e.x += Math.sin(e.wobble) * 0.8;
      e.y += e.speed;
      e.x = Math.max(e.w / 2, Math.min(W - e.w / 2, e.x));

      if (e.shoots) {
        e.shootTimer++;
        if (e.shootTimer > 90) {
          e.shootTimer = 0;
          shootEnemyBullet(e);
        }
      }

      if (e.y > H + 50) {
        enemies.splice(i, 1);
        continue;
      }

      // collision with player
      if (player.invuln <= 0) {
        const pBox = { x: player.x - 14, y: player.y - 16, w: 28, h: 32 };
        const eBox = { x: e.x - e.w / 2, y: e.y - e.h / 2, w: e.w, h: e.h };
        if (rectsOverlap(pBox, eBox)) {
          spawnBurst(e.x, e.y, e.color, 14);
          enemies.splice(i, 1);
          hitPlayer();
          continue;
        }
      }

      // collision with player bullets
      for (let j = bullets.length - 1; j >= 0; j--) {
        const bBox = { x: bullets[j].x - bullets[j].w / 2, y: bullets[j].y - bullets[j].h / 2, w: bullets[j].w, h: bullets[j].h };
        const eBox = { x: e.x - e.w / 2, y: e.y - e.h / 2, w: e.w, h: e.h };
        if (rectsOverlap(bBox, eBox)) {
          bullets.splice(j, 1);
          e.hp--;
          spawnBurst(bullets[j] ? bullets[j].x : e.x, e.y, e.color, 4);
          if (e.hp <= 0) {
            score += e.points;
            spawnBurst(e.x, e.y, e.color, 18);
            enemies.splice(i, 1);
          }
          break;
        }
      }
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    liveScoreEl.textContent = score;
  }

  function hitPlayer() {
    player.lives--;
    player.invuln = 90;
    updateLivesUI();
    spawnBurst(player.x, player.y, '#2de2e6', 20);
    if (player.lives <= 0) {
      endGame();
    }
  }

  function drawStars() {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    stars.forEach(s => {
      ctx.globalAlpha = 0.3 + s.speed / 3;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    if (player.invuln > 0 && Math.floor(frame / 4) % 2 === 0) return;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.shadowColor = '#2de2e6';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#2de2e6';
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(16, 18);
    ctx.lineTo(0, 10);
    ctx.lineTo(-16, 18);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffb020';
    ctx.beginPath();
    ctx.arc(0, -2, 5, 0, Math.PI * 2);
    ctx.fill();
    // engine flame
    const flameLen = 8 + Math.random() * 6;
    ctx.fillStyle = '#ff3b7f';
    ctx.beginPath();
    ctx.moveTo(-6, 16);
    ctx.lineTo(0, 16 + flameLen);
    ctx.lineTo(6, 16);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBullets() {
    ctx.fillStyle = '#ffb020';
    ctx.shadowColor = '#ffb020';
    ctx.shadowBlur = 8;
    bullets.forEach(b => {
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    });
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ff3b7f';
    ctx.shadowColor = '#ff3b7f';
    ctx.shadowBlur = 8;
    enemyBullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function drawEnemies() {
    enemies.forEach(e => {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(0, e.h / 2);
      ctx.lineTo(e.w / 2, -e.h / 2);
      ctx.lineTo(0, -e.h / 4);
      ctx.lineTo(-e.w / 2, -e.h / 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      if (e.hp < e.maxHp) {
        const barW = e.w;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(e.x - barW / 2, e.y - e.h / 2 - 10, barW, 4);
        ctx.fillStyle = '#2de2e6';
        ctx.fillRect(e.x - barW / 2, e.y - e.h / 2 - 10, barW * (e.hp / e.maxHp), 4);
      }
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life / 26, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawStars();
    drawEnemies();
    drawBullets();
    drawPlayer();
    drawParticles();
  }

  function loop() {
    if (state !== 'playing') return;
    update();
    render();
    requestAnimationFrame(loop);
  }

  // input handling — drag to move
  function getCanvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const pos = getCanvasPos(t.clientX, t.clientY);
    pointerActive = true;
    pointerX = pos.x; pointerY = pos.y;
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const pos = getCanvasPos(t.clientX, t.clientY);
    pointerX = pos.x; pointerY = pos.y;
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    pointerActive = false;
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    const pos = getCanvasPos(e.clientX, e.clientY);
    pointerActive = true;
    pointerX = pos.x; pointerY = pos.y;
  });
  window.addEventListener('mousemove', (e) => {
    if (!pointerActive) return;
    const pos = getCanvasPos(e.clientX, e.clientY);
    pointerX = pos.x; pointerY = pos.y;
  });
  window.addEventListener('mouseup', () => { pointerActive = false; });

  window.addEventListener('resize', () => {
    resizeCanvas();
    initStars();
  });

  resizeCanvas();
  initStars();
  player.x = W / 2;
  player.y = H - 110;
  render();
  loadSavedSetup();

  startBtn.addEventListener('click', () => {
    const setup = validateAndCollectSetup();
    if (!setup) return;
    playerName = setup.name;
    playerAge = setup.age;
    try {
      localStorage.setItem('skgaming_setup', JSON.stringify({
        name: playerName, age: playerAge, difficulty: difficultyLevel
      }));
    } catch (e) {}
    startGame();
  });
  restartBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
